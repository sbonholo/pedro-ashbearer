<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#141c26">
<meta name="description" content="Ashbearer - a 3D fantasy party RPG. Walk the party through three regions and fight in real time.">
<title>Ashbearer</title>
<link rel="preload" href="vendor/three.bundle.js" as="script">
<link rel="preload" href="fonts/grenze-gotisch-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- OWNER: UI lane (game flow + ui + audio). DOM roots only; ui.js builds everything inside #ab-ui / #ab-touch. -->
<div id="ab-root" data-screen="boot" data-input="kbm">
  <div id="ab-view" aria-hidden="true"></div>
  <div id="ab-ui"></div>
  <div id="ab-touch"></div>
  <div id="ab-loading" role="status" aria-live="polite" data-boot="1">
    <div class="ab-loading-mark" aria-hidden="true"></div>
    <p class="ab-loading-act"></p>
    <p class="ab-loading-title">Ashbearer</p>
    <p class="ab-loading-text">Kindling the road...</p>
    <div class="ab-loading-line" aria-hidden="true"></div>
    <div class="ab-loading-bar" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
  </div>
</div>
<noscript><p style="position:fixed;inset:auto 0 40%;text-align:center;color:#e8e2cf;font:16px Georgia,serif">Ashbearer needs JavaScript to run.</p></noscript>
<!-- boot.js: error toast, loading progress, then loads vendor/three.bundle.js + js/*.js in order -->
<script src="js/boot.js"></script>
</body>
</html>
